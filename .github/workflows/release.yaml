---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream Iframely tag to release, e.g. v26.11.13"
        type: string
        required: true
      patch:
        description: "Our patch number. Bump it to re-release the same upstream tag."
        type: string
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the series
    runs-on: ubuntu-latest

    # Env vars, never `${{ }}` inside a run block: an input expanded into a script can close the
    # quote and run.
    env:
      TAG: ${{ inputs.version }}
      PATCH: ${{ inputs.patch || '0' }}

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Normalise the tag
        id: upstream
        run: echo "tag=v${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # quilt is in neither the mise registry nor the pkgx pantry; apt is the only source for it.
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: quilt
          version: 1.0

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      # The pin is resolved against upstream's tags, not `git describe`: actions/checkout fetches
      # submodules shallow and without tags.
      - name: Check the submodule is on the version being released
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          source ./.mise/lib.sh
          pinned="$(iframely_tag)"
          if [[ "$pinned" != "$UPSTREAM_TAG" ]]; then
            echo "lib/iframely is on $pinned but the release says $UPSTREAM_TAG"
            exit 1
          fi

      - name: Set our version
        id: version
        run: |
          source ./.mise/lib.sh
          echo "version=$(iframely_version "$PATCH")" >> "$GITHUB_OUTPUT"

      # No `quilt push -a` ahead of it: test:series pops and pushes the series itself.
      - run: mise run test:series

  image:
    name: Image
    needs: check
    # `$/` is what zizmor's self-repository audit asks for, but actionlint 1.7.12 rejects it.
    uses: ./.github/workflows/image.yaml # zizmor: ignore[self-repository]
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    with:
      release: true
      patch: ${{ inputs.patch || '0' }}

  release:
    name: Draft the release
    runs-on: ubuntu-latest
    needs: [check, image]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Everything between "## Unreleased" and the next "## ", trailing blank lines stripped, then
      # the image the release published.
      - name: Write the release notes
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/iframely
          VERSION: ${{ needs.check.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          mkdir -p .cache
          awk '/^## Unreleased/ {f=1; next} /^## / {f=0} f' CHANGELOG.md \
            | sed -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' > .cache/release-notes
          printf '\n## Image\n\n    %s:%s@%s\n' "$IMAGE" "$VERSION" "$DIGEST" >> .cache/release-notes
          cat .cache/release-notes

      # A human publishes the draft.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.2 # zizmor: ignore[superfluous-actions]
        with:
          draft: true
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          body_path: .cache/release-notes
